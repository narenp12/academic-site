    Professional Experience:
      - company: LivaNova
        position: Data Management and Strategy
        location: Houston, TX
        start_date: 2025-05
        end_date: 2026-04
        summary: Established recurring measurement of enterprise cloud consumption.
        highlights:
          - Selected telemetry that actually measured cost and utilization, chose statistics to publish, and fixed how each estimate would be computed before building.
          - Trained time series forecasting and anomaly-detection models on consumption data; surfaced idle and over-provisioned spend.
          - Built ELT pipelines in Azure Synapse Analytics and Azure Data Factory, replacing a monthly email report and cutting reporting lag from roughly 30 days to near real time.
          - Produced published estimates in SQL, Python, and Power BI and the dashboards reporting them; documented data lineage, model assumptions, and limitations for non-technical reviewers.

      - company: Halliburton
