        location: Los Angeles, CA
        start_date: 2025-03
        end_date: 2025-06
        summary: Sole owner of the institutional-factors research question within a five-person team, from analysis plan to presentation of recommendations to the client.
        highlights:
          - Scoped the institutional-factors question for UCLA Academic Planning and Budget into an analysis plan and presented recommendations to the client.
          - Assembled the data layer from College Scorecard and NCES IPEDS records (2004-2023) joined on CIP codes; cost-adjusted earnings against scraped county living-wage estimates; imputed missing fields by chained equations with random forests.
          - Derived peer groups by HDBSCAN clustering; ranked index drivers by cross-validated LASSO and random-forest importance.
          - Delivered findings as an interactive Dash/Plotly dashboard with pinned dependencies, reproducible by the client unaided.

      - institution: Department of Statistics, UCLA
        position: Undergraduate Researcher
        location: Los Angeles, CA
        start_date: 2025-01
        end_date: 2025-06
        summary: Studied methodological change across 136,238 arXiv records with a pre-registered estimation approach.
        highlights:
          - Designed a study of methodological change across 136,238 arXiv records; fixed estimation approach and analysis plan before running anything; deduplicated records and measured how dropping incomplete records shifted corpus composition.
          - Built a hybrid topic-classification pipeline over LDA, BERTopic, and transformer embeddings; required agreement across all three methods before treating an assignment as an estimation input.
          - Trained and validated a LightGBM model forecasting research-output trends by topic; evaluated stability across topic groups of very different sizes.

      - institution: Bruin Sports Analytics, UCLA
        position: Researcher and Analyst
        location: Los Angeles, CA
        start_date: 2024-09
        end_date: 2025-06
        summary: Bayesian sequential inference over NFL play-by-play data, adopted by UCLA coaching staff.
        highlights:
          - Estimated NFL route-target probabilities by Bayesian updating over nflfastR play-by-play data, with posteriors revised sequentially as observations accumulated.
          - Designed recurring match-report visualizations of rate and frequency estimates; adopted by UCLA men's tennis coaching staff for opponent scouting.

    Teaching Experience:
      - institution: Department of Statistics, UCLA
        position: Statistics Curriculum Consultant
        location: Remote
        start_date: 2026-06
        end_date: present
        summary: End-to-end design of a Bayesian statistics module for an upper-division UCLA course.
        highlights:
          - Translate current research literature into lecture material, worked estimation examples, and graded assignments packaged for instructor reuse.
          - Write original expositions of each method's estimation approach and its assumptions, with original diagrams, sufficient for an instructor to teach the method from the write-up alone.
          - Devised per-student parameterized assignments with variant parameters hashed from student identifier, checked against known analytic results, resistant to answer sharing and language-model submissions.
          - Built the authoring toolchain and a test-backed Jupyter notebook assignment deployed in Canvas.

