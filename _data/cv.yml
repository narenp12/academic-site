        location: Houston, TX
        start_date: 2024-06
        end_date: 2024-09
        summary: Time series modeling for predictive maintenance over truck-sensor telemetry targeting failures that put field operators at risk of injury.
        highlights:
          - Built and trained a transformer model for sequential anomaly detection from scratch, reaching 92% precision at 95% accuracy on held-out data under a time-aware validation split.
          - Benchmarked competing estimators by reproducing published approaches against established baselines on common held-out data.
          - Wrote a Dask multiprocessing pipeline generating and streaming synthetic training data matched to the observed telemetry distribution, clearing a throughput bottleneck on CUDA-accelerated training.

